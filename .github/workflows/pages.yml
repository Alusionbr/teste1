name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: file360/pnpm-lock.yaml

      - name: Install File360
        working-directory: file360
        run: pnpm install --frozen-lockfile

      - name: Build File360
        working-directory: file360
        env:
          NEXT_PUBLIC_BASE_PATH: /teste1/file360
          NEXT_PUBLIC_PRODUCTION: "true"
        run: pnpm build

      - name: Install Financeiro360
        id: financeiro_install
        continue-on-error: true
        working-directory: financeiro360
        run: npm ci

      - name: Validate Financeiro360
        id: financeiro_validation
        if: steps.financeiro_install.outcome == 'success'
        continue-on-error: true
        working-directory: financeiro360
        run: |
          npm test
          npm run test:db

      - name: Build Financeiro360
        id: financeiro_build
        if: steps.financeiro_install.outcome == 'success' && steps.financeiro_validation.outcome == 'success'
        continue-on-error: true
        working-directory: financeiro360
        env:
          # Public browser configuration; financial access is enforced by RLS.
          VITE_SUPABASE_URL: https://iowuejrpzoibyidiuvpt.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_RJisxh4p6IAXX_nPVtkMeQ__-QcfB8p
        run: npm run build -- --base /teste1/financeiro360/

      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' --exclude='file360' --exclude='financeiro360' ./ _site/
          mkdir -p _site/file360
          cp -a file360/out/. _site/file360/
          touch _site/.nojekyll

      - name: Stage Financeiro360
        if: steps.financeiro_build.outcome == 'success' && hashFiles('financeiro360/dist/index.html') != ''
        run: |
          mkdir -p _site/financeiro360
          cp -a financeiro360/dist/. _site/financeiro360/

      - name: Warn if Financeiro360 is unavailable
        if: steps.financeiro_install.outcome != 'success' || steps.financeiro_build.outcome != 'success' || hashFiles('financeiro360/dist/index.html') == ''
        run: echo "::warning::Financeiro360 não entrou no artefato Pages; verifique npm ci e build. Os demais projetos serão publicados."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
