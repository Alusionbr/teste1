name: Karaokê em Casa checks
on:
  push:
    paths:
      - 'karaoke/**'
      - '.github/workflows/karaoke-check.yml'
  pull_request:
    paths:
      - 'karaoke/**'
      - '.github/workflows/karaoke-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: |
          for f in karaoke/*.js karaoke/tests/*.js; do node --check "$f"; done
      - name: Unit and contract tests
        run: node --test karaoke/tests/*.test.js
      - name: Preparar navegador de teste
        run: |
          npm install --prefix "$RUNNER_TEMP/karaoke-navegador" playwright@1.58.2
          "$RUNNER_TEMP/karaoke-navegador/node_modules/.bin/playwright" install --with-deps chromium
      - name: Testar o palco e o controle no navegador
        run: |
          export NODE_PATH="$RUNNER_TEMP/karaoke-navegador/node_modules"
          python3 -m http.server 8765 -d karaoke >/tmp/karaoke-http.log 2>&1 &
          servidor=$!
          trap 'kill "$servidor"' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8765/ -o /dev/null
          node karaoke/tests/browser-uso.js
          node karaoke/tests/browser-smoke.js
