<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle360 Multi — Estoque, CMV, Produção, Vendas e Consignados</title>
  <style>
/* Controle360 Multi — interface operacional.
   Direção: ferramenta de trabalho calma e legível. Estrutura em verde-petróleo,
   um único acento âmbar para ação e dinheiro, números tabulares alinhados como
   assinatura (estoque e valores sempre "batem" coluna a coluna). */

:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --surface-soft: #f6f8f7;
  --ink: #14302f;
  --text: #1f2d2c;
  --muted: #5d6f6d;
  --line: #d8e1df;
  --line-strong: #c2cfcc;
  --brand: #0f6b62;
  --brand-deep: #0c4f49;
  --brand-soft: #e4efed;
  --accent: #c9610c;
  --accent-soft: #fbeede;
  --danger: #b3261e;
  --danger-soft: #fbe7e6;
  --success: #1f7a45;
  --success-soft: #e3f3ea;
  --warning: #9a5a08;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 12px 30px rgba(12, 60, 56, 0.10);
  --shadow-sm: 0 4px 14px rgba(12, 60, 56, 0.07);
  --num: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(1200px 480px at 100% -10%, rgba(15, 107, 98, 0.10), transparent 60%),
    var(--bg);
  color: var(--text);
  line-height: 1.5;
}

h1, h2, h3 { line-height: 1.18; margin: 0; color: var(--ink); letter-spacing: -0.01em; }
p { margin: 0; }

button, input, select, textarea { font: inherit; color: inherit; }

/* ---------- Botões ---------- */
button {
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: #fff;
  padding: 0.7rem 1.05rem;
  cursor: pointer;
  font-weight: 650;
  letter-spacing: 0.005em;
  transition: transform 0.04s ease, background-color 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
button:hover { background: #b3550a; }
button:active { transform: translateY(1px); }
button:disabled { opacity: 0.45; cursor: not-allowed; }

button.secondary {
  background: var(--brand);
}
button.secondary:hover { background: var(--brand-deep); }

button.ghost {
  background: transparent;
  color: var(--brand-deep);
  border-color: var(--line-strong);
}
button.ghost:hover { background: var(--brand-soft); border-color: var(--brand); }

button.danger { background: var(--danger); }
button.danger:hover { background: #8f1e17; }
button.danger.ghost { background: transparent; color: var(--danger); border-color: var(--danger-soft); }
button.danger.ghost:hover { background: var(--danger-soft); }

button.small { padding: 0.4rem 0.7rem; font-size: 0.85rem; border-radius: 8px; }

:focus-visible {
  outline: 3px solid rgba(15, 107, 98, 0.45);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ---------- Cabeçalho ---------- */
.app-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1.5rem;
  padding: 1.1rem clamp(1rem, 4vw, 2.4rem);
  background: linear-gradient(180deg, var(--brand-deep), var(--brand));
  color: #eafaf7;
  box-shadow: var(--shadow-sm);
}
.app-header .brand p { color: #c4e7e2; max-width: 60ch; }
.app-header h1 {
  color: #ffffff;
  font-size: clamp(1.4rem, 3.4vw, 2rem);
  font-weight: 760;
  margin: 0.15rem 0 0.25rem;
}
.app-header h1 span { color: var(--accent-soft); font-weight: 760; }
.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.16em;
  font-size: 0.66rem;
  font-weight: 700;
  color: #a9dcd5 !important;
}
.header-actions { display: flex; gap: 0.6rem; flex-shrink: 0; }
.app-header button.secondary { background: var(--accent); }
.app-header button.secondary:hover { background: #b3550a; }
.app-header button.ghost { color: #eafaf7; border-color: rgba(255, 255, 255, 0.35); }
.app-header button.ghost:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255,255,255,0.6); }

/* ---------- Estrutura ---------- */
.app-shell {
  max-width: 1180px;
  margin: 0 auto;
  padding: clamp(1rem, 3vw, 1.8rem) clamp(0.8rem, 4vw, 2.4rem) 4rem;
}

.business-bar {
  display: flex;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 0.85rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.9rem 1rem;
  box-shadow: var(--shadow-sm);
}
.business-bar > div { display: flex; flex-direction: column; gap: 0.3rem; flex: 1 1 240px; }
.business-bar label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.business-bar select { min-width: 200px; }

/* ---------- Dashboard ---------- */
.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
  gap: 0.8rem;
  margin: 1.1rem 0;
}
.metric-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.95rem 1.05rem;
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.metric-card::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
  background: var(--brand);
}
.metric-card span { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.metric-card strong { font-size: 1.5rem; font-weight: 720; font-variant-numeric: tabular-nums; font-family: var(--num); color: var(--ink); }

/* ---------- Abas ---------- */
.tabs {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  gap: 0.25rem;
  margin: 1.1rem 0 1.2rem;
  padding: 0.35rem;
  background: rgba(246, 248, 247, 0.92);
  backdrop-filter: blur(6px);
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.tabs::-webkit-scrollbar { height: 6px; }
.tabs::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 999px; }
.tab-button {
  background: transparent;
  color: var(--muted);
  border: 0;
  padding: 0.55rem 0.95rem;
  border-radius: 999px;
  font-weight: 650;
  white-space: nowrap;
  flex: 0 0 auto;
}
.tab-button:hover { background: var(--brand-soft); color: var(--brand-deep); }
.tab-button.active { background: var(--brand); color: #fff; }

/* ---------- Seções ---------- */
.view { display: block; }
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 1.1rem;
}
.section-head h2 { font-size: 1.3rem; font-weight: 720; }
.section-head p { color: var(--muted); margin-top: 0.25rem; max-width: 72ch; }

/* ---------- Formulários ---------- */
.grid-form {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 0.85rem 1rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.15rem;
  margin-bottom: 1.4rem;
  box-shadow: var(--shadow-sm);
}
.grid-form label {
  display: flex;
  flex-direction: column;
  gap: 0.32rem;
  font-weight: 650;
  font-size: 0.86rem;
  color: var(--ink);
}
.grid-form label.full { grid-column: 1 / -1; }
.grid-form label span {
  font-weight: 500;
  font-size: 0.76rem;
  color: var(--muted);
}
.grid-form button[type="submit"] {
  grid-column: 1 / -1;
  justify-self: start;
  padding: 0.78rem 1.5rem;
}

input, select, textarea {
  width: 100%;
  background: var(--surface-soft);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  padding: 0.6rem 0.7rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--brand);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(15, 107, 98, 0.16);
}
textarea { min-height: 76px; resize: vertical; }
input[type="number"] { font-variant-numeric: tabular-nums; font-family: var(--num); }

/* ---------- Tabelas ---------- */
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow-sm);
}
table { width: 100%; border-collapse: collapse; min-width: 540px; }
thead th {
  position: sticky;
  top: 0;
  text-align: left;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  background: var(--surface-soft);
  padding: 0.7rem 0.85rem;
  border-bottom: 2px solid var(--line);
  white-space: nowrap;
}
tbody td {
  padding: 0.65rem 0.85rem;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  font-size: 0.92rem;
}
tbody tr:nth-child(even) td { background: rgba(15, 107, 98, 0.025); }
tbody tr:hover td { background: var(--brand-soft); }
tbody td strong { font-variant-numeric: tabular-nums; font-family: var(--num); font-weight: 650; }
table .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }

/* ---------- Badges ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.2rem;
  padding: 0.12rem 0.5rem;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  background: var(--brand-soft);
  color: var(--brand-deep);
  white-space: nowrap;
}
.badge.ok { background: var(--success-soft); color: var(--success); }
.badge.warn { background: var(--accent-soft); color: var(--accent); }

/* ---------- Avisos ---------- */
.notice {
  border-radius: var(--radius-sm);
  padding: 0.8rem 1rem;
  font-size: 0.9rem;
  border: 1px solid var(--line);
  background: var(--surface-soft);
  margin-bottom: 1rem;
}
.notice.warning { background: var(--accent-soft); border-color: #f0d4b3; color: #7a4406; }
.notice.info { background: var(--brand-soft); border-color: #bfe0db; color: var(--brand-deep); }
.notice.success { background: var(--success-soft); border-color: #c2e4cf; color: var(--success); }
.notice.error { background: var(--danger-soft); border-color: #f0c5c2; color: var(--danger); }

/* ---------- Estado vazio ---------- */
.empty-state {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  align-items: flex-start;
  padding: 2rem 1.4rem;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface-soft);
  color: var(--muted);
}
.empty-state strong { color: var(--ink); font-size: 1.02rem; }

/* ---------- Cartões e colunas ---------- */
.panel-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem;
  box-shadow: var(--shadow-sm);
  margin-top: 1.1rem;
}
.panel-card h3 { font-size: 1rem; margin-bottom: 0.75rem; }
.three-columns {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1rem;
}
.three-columns .panel-card { margin-top: 0; }

/* ---------- Caixa de custo ---------- */
.cost-box {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 0.7rem;
  margin-top: 1rem;
}
.cost-item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 0.75rem 0.9rem;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.cost-item span { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
.cost-item strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; font-family: var(--num); color: var(--ink); }

/* ---------- Kanban ---------- */
.kanban {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(230px, 1fr);
  gap: 0.8rem;
  overflow-x: auto;
  padding-bottom: 0.5rem;
}
.kanban-column {
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.7rem;
  min-height: 120px;
}
.kanban-column h3 { font-size: 0.86rem; display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.kanban-dropzone { display: flex; flex-direction: column; gap: 0.55rem; min-height: 40px; border-radius: var(--radius-sm); }
.kanban-column.drag-over { outline: 2px dashed var(--brand); outline-offset: 2px; background: var(--brand-soft); }
.kanban-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 0.7rem 0.8rem;
  box-shadow: var(--shadow-sm);
  cursor: grab;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}
.kanban-card:active { cursor: grabbing; }
.kanban-card strong { font-size: 0.95rem; color: var(--ink); }
.kanban-card p { font-size: 0.82rem; color: var(--muted); }
.kanban-card .actions { margin-top: 0.3rem; display: flex; gap: 0.35rem; flex-wrap: wrap; }

/* ---------- Hub de backup / exportação ---------- */
.export-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
  margin-bottom: 1.2rem;
}
.export-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}
.export-card.highlight { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), var(--shadow-sm); }
.export-card-head { display: flex; align-items: center; gap: 0.5rem; }
.export-card-head h3 { font-size: 1.05rem; }
.export-card p { font-size: 0.88rem; color: var(--muted); }
.export-tag {
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 800;
  color: var(--brand-deep);
  background: var(--brand-soft);
  padding: 0.16rem 0.5rem;
  border-radius: 999px;
}
.export-actions { display: flex; gap: 0.55rem; flex-wrap: wrap; align-items: center; margin-top: auto; }
.export-actions.wrap { gap: 0.45rem; }
.hint-inline { font-size: 0.68rem; font-weight: 600; color: var(--muted); opacity: 0.85; }

/* Botão de arquivo (input file estilizado) */
.file-button {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--brand-deep);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  padding: 0.7rem 1.05rem;
  font-weight: 650;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease;
}
.file-button:hover { background: var(--brand-soft); border-color: var(--brand); }
.file-button input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

/* ---------- Toasts ---------- */
.toast-host {
  position: fixed;
  left: 50%;
  bottom: 1.3rem;
  transform: translateX(-50%);
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  align-items: center;
  pointer-events: none;
  width: min(92vw, 460px);
}
.toast {
  pointer-events: auto;
  background: var(--ink);
  color: #eafaf7;
  border-radius: var(--radius-sm);
  padding: 0.7rem 1rem;
  font-size: 0.9rem;
  font-weight: 600;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.22s ease, transform 0.22s ease;
  max-width: 100%;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

pre {
  background: var(--ink);
  color: #d8efea;
  padding: 1rem;
  border-radius: var(--radius);
  overflow: auto;
  font-size: 0.8rem;
  max-height: 360px;
}

/* ---------- Ajuda contextual (ícone ⓘ + balão explicativo) ---------- */
/* Linha de rótulo: texto do campo + ícone de ajuda na mesma linha. */
.grid-form label > .field-label,
.stack-form label > .field-label {
  display: flex;
  align-items: center;
  gap: 0.34rem;
  font-weight: 650;
  font-size: 0.86rem;
  color: var(--ink);
}

/* Ícone "ⓘ" clicável/hover. tabindex torna acessível ao toque no celular.
   O seletor [data-tip] eleva a especificidade para vencer regras de span
   herdadas (ex.: .metric-card span em maiúsculas, hints esmaecidos). */
.help[data-tip] {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid #bfe0db;
  background: var(--brand-soft);
  color: var(--brand-deep);
  font-size: 0.66rem;
  font-weight: 800;
  font-style: normal;
  line-height: 1;
  letter-spacing: 0;
  text-transform: none;
  cursor: help;
  user-select: none;
  vertical-align: middle;
}
.help[data-tip]:hover { background: #d2e8e4; }
.help[data-tip]:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
/* Ajuda usada dentro de um título de métrica do painel. */
.metric-card .help[data-tip] { margin-left: 0.35rem; }

/* Balão único, posicionado por JS em coordenadas fixas (não é cortado por
   nenhum contêiner e fica sempre dentro da tela). */
.help-tip {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 9999;
  max-width: 280px;
  background: var(--ink);
  color: #fff;
  font-size: 0.78rem;
  font-weight: 500;
  font-style: normal;
  line-height: 1.45;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
  padding: 0.6rem 0.75rem;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(12, 60, 56, 0.28);
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transform: translateY(3px);
  transition: opacity 0.14s ease, transform 0.14s ease;
}
.help-tip.show { opacity: 1; visibility: visible; transform: translateY(0); }

/* ---------- Responsivo ---------- */
@media (max-width: 720px) {
  .app-header { flex-direction: column; align-items: flex-start; gap: 0.9rem; }
  .header-actions { width: 100%; }
  .header-actions button { flex: 1; }
  .section-head { flex-direction: column; }
  table { min-width: 460px; }
  .help-tip { max-width: min(280px, calc(100vw - 24px)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <p class="eyebrow">Controle local · seus dados ficam no navegador</p>
      <h1>Controle360 <span>Multi</span></h1>
      <p>Estoque, ficha técnica, custo de produto, vendas, pedidos, tarefas e consignados para vários negócios.</p>
    </div>
    <div class="header-actions">
      <button id="btnExport" class="secondary">Baixar Excel</button>
      <button id="btnDataTab" class="ghost">Backup e exportação</button>
    </div>
  </header>

  <main class="app-shell">
    <section class="business-bar" aria-label="Negócio ativo">
      <div>
        <label for="activeBusiness">Negócio ativo</label>
        <select id="activeBusiness"></select>
      </div>
      <button id="btnNewBusiness">Novo negócio</button>
      <button id="btnReset" class="danger ghost">Zerar dados locais</button>
    </section>

    <section id="dashboard" class="dashboard"></section>

    <nav class="tabs" aria-label="Módulos do sistema">
      <button class="tab-button active" data-tab="negocios">Negócios</button>
      <button class="tab-button" data-tab="produtos">Produtos</button>
      <button class="tab-button" data-tab="clientes">Clientes</button>
      <button class="tab-button" data-tab="fornecedores">Fornecedores</button>
      <button class="tab-button" data-tab="compras">Compras</button>
      <button class="tab-button" data-tab="fichas">Fichas e custos</button>
      <button class="tab-button" data-tab="producao">Produção</button>
      <button class="tab-button" data-tab="vendas">Vendas</button>
      <button class="tab-button" data-tab="pedidos">Pedidos</button>
      <button class="tab-button" data-tab="consignado">Consignado</button>
      <button class="tab-button" data-tab="tarefas">Tarefas</button>
      <button class="tab-button" data-tab="relatorios">Relatórios</button>
      <button class="tab-button" data-tab="dados">Dados</button>
    </nav>

    <section id="view" class="view"></section>
  </main>

  <template id="emptyStateTemplate">
    <div class="empty-state">
      <strong>Nenhum registro ainda.</strong>

(function () {
  'use strict';

  window.C360 = window.C360 || {};

  function uid(prefix) {
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
  }

  function today() {
    const date = new Date();
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function nowIso() {
    return new Date().toISOString();
  }

  function number(value, fallback = 0) {
    if (typeof value === 'number') return Number.isFinite(value) ? value : fallback;
    const text = String(value ?? '').trim();
    if (!text) return fallback;
    const normalized = text.includes(',')
      ? text.replace(/\s/g, '').replace(/\./g, '').replace(',', '.')
      : text.replace(/\s/g, '');
    const parsed = Number(normalized);
    return Number.isFinite(parsed) ? parsed : fallback;
  }

  function percent(value) {
    return number(value) / 100;
  }

  function money(value) {
    return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(number(value));
  }

  function qty(value, unit) {
    const formatted = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 }).format(number(value));
    return unit ? `${formatted} ${unit}` : formatted;
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function downloadBlob(filename, blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function downloadText(filename, text, mime = 'application/json') {
    downloadBlob(filename, new Blob([text], { type: mime }));
  }

  function formData(form) {
    return Object.fromEntries(new FormData(form).entries());
  }

  function sortByDateDesc(items, key = 'date') {
    return [...items].sort((a, b) => String(b[key] || '').localeCompare(String(a[key] || '')));
  }

  function findById(items, id) {
    return items.find((item) => item.id === id) || null;
  }

  function compact(value, fallback = '—') {
    return value === undefined || value === null || value === '' ? fallback : value;
  }

  function assertPositive(value, label) {
    if (number(value) <= 0) throw new Error(`${label} precisa ser maior que zero.`);
  }

  window.C360.utils = {
    uid,
    today,
    nowIso,
    number,
    percent,
    money,
    qty,
    escapeHtml,
    downloadBlob,
    downloadText,
    formData,
    sortByDateDesc,
    findById,
    compact,
    assertPositive,
  };
})();

      { value: 'aguardando', label: 'Aguardando' },
      { value: 'feito', label: 'Feito' },
    ],
  };

  function emptyState() {
    return {
      meta: {
        schemaVersion: 2,
        createdAt: nowIso(),
        updatedAt: nowIso(),
      },
      activeBusinessId: null,
      settings: structuredClone(DEFAULT_SETTINGS),
      businesses: [],
      products: [],
      clients: [],
      suppliers: [],
      purchases: [],
      stockMovements: [],
      recipes: [],
      productions: [],
      sales: [],
      orders: [],
      consignments: [],
      consignmentEvents: [],
      tasks: [],
    };
  }

  function normalize(raw) {
    const base = emptyState();
    const state = { ...base, ...(raw || {}) };
    state.meta = { ...base.meta, ...(state.meta || {}) };
    state.settings = { ...base.settings, ...(state.settings || {}) };
    Object.keys(base).forEach((key) => {
      if (Array.isArray(base[key]) && !Array.isArray(state[key])) state[key] = [];
    });
    return state;
  }

  function load() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return emptyState();
      return normalize(JSON.parse(stored));
    } catch (error) {
      console.error('Erro ao carregar estado local:', error);
      return emptyState();
    }
  }

  let state = load();

  function getState() {
    return state;
  }

  function save() {
    state.meta.updatedAt = nowIso();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function replaceState(nextState) {
    state = normalize(nextState);
    save();
  }

  function reset() {
    state = emptyState();
    localStorage.removeItem(STORAGE_KEY);
  }

  function activeBusiness() {
    return state.businesses.find((business) => business.id === state.activeBusinessId) || null;
  }

  function ensureBusiness() {
    if (!state.activeBusinessId) {
      throw new Error('Cadastre ou selecione um negócio antes de lançar dados.');
    }
  }

  function byBusiness(collectionName) {
    const businessId = state.activeBusinessId;
    if (!businessId) return [];
    return state[collectionName].filter((item) => item.businessId === businessId);
  }

  function add(collectionName, payload) {
    ensureBusiness();
    const record = {
      id: uid(collectionName),
      businessId: state.activeBusinessId,
      createdAt: nowIso(),
      updatedAt: nowIso(),
      ...payload,
    };
    state[collectionName].push(record);
    save();
    return record;
  }

  function addGlobal(collectionName, payload) {
    const record = {
      id: uid(collectionName),
      createdAt: nowIso(),
      updatedAt: nowIso(),
      ...payload,
    };
    state[collectionName].push(record);
    save();
    return record;
  }

  function update(collectionName, id, patch) {
    const item = state[collectionName].find((record) => record.id === id);
    if (!item) throw new Error(`Registro não encontrado em ${collectionName}.`);
    Object.assign(item, patch, { updatedAt: nowIso() });
    save();
    return item;
  }

  function remove(collectionName, id) {
    const index = state[collectionName].findIndex((record) => record.id === id);
    if (index === -1) return;
    state[collectionName].splice(index, 1);
    save();
  }

  function setActiveBusiness(id) {
    state.activeBusinessId = id || null;
    save();
  }

  function recordMovement(payload) {
    ensureBusiness();
    const movement = {
      id: uid('mov'),
      businessId: state.activeBusinessId,
      createdAt: nowIso(),
      ...payload,
    };
    state.stockMovements.push(movement);
    save();
    return movement;
  }

  window.C360.state = {
    DEFAULT_SETTINGS,
    getState,
    save,
    replaceState,
    reset,
    activeBusiness,
    ensureBusiness,
    byBusiness,
    add,
    addGlobal,
    update,
    remove,
    setActiveBusiness,
    recordMovement,
  };
})();

(function () {
  'use strict';

  window.C360 = window.C360 || {};
  const { number } = window.C360.utils;

  function weightedAverageCost(currentStock, currentAvgCost, incomingQuantity, incomingTotalCost) {
    const stock = number(currentStock);
    const avg = number(currentAvgCost);
    const qty = number(incomingQuantity);
    const total = number(incomingTotalCost);
    const currentValue = Math.max(stock, 0) * avg;
    const newQuantity = Math.max(stock, 0) + qty;
    if (newQuantity <= 0) return 0;
    return (currentValue + total) / newQuantity;
  }

  function calculateRecipeCost(finalProductId, state) {
    const finalProduct = state.products.find((product) => product.id === finalProductId);
    const rows = state.recipes.filter((row) => row.finalProductId === finalProductId);

    const items = rows.map((row) => {
      const input = state.products.find((product) => product.id === row.inputProductId);
      const quantityPerUnit = number(row.quantityPerUnit);
      const avgCost = input ? number(input.avgCost) : 0;
      return {
        ...row,
        input,
        quantityPerUnit,
        avgCost,
        costPerUnit: quantityPerUnit * avgCost,
      };
    });

    const materialsCost = items.reduce((sum, item) => sum + item.costPerUnit, 0);
    const laborCost = number(finalProduct?.laborCostPerUnit);
    const overheadCost = number(finalProduct?.overheadCostPerUnit);
    const baseCost = materialsCost + laborCost + overheadCost;
    const lossPercent = number(finalProduct?.lossPercent) / 100;
    const lossCost = baseCost * Math.max(lossPercent, 0);
    const totalCostPerUnit = baseCost + lossCost;
    const targetMarginPercent = number(finalProduct?.targetMarginPercent) / 100;
    const taxFeePercent = number(finalProduct?.taxFeePercent) / 100;
    const denominator = 1 - targetMarginPercent - taxFeePercent;
    const suggestedSalePrice = denominator > 0.02 ? totalCostPerUnit / denominator : 0;
    const manualSalePrice = number(finalProduct?.salePrice);
    const selectedSalePrice = manualSalePrice > 0 ? manualSalePrice : suggestedSalePrice;
    const grossProfitAtSelectedPrice = selectedSalePrice - (selectedSalePrice * taxFeePercent) - totalCostPerUnit;
    const marginAtSelectedPrice = selectedSalePrice > 0 ? grossProfitAtSelectedPrice / selectedSalePrice : 0;

    return {
      finalProduct,
      items,
      materialsCost,
      laborCost,
      overheadCost,
      baseCost,
      lossCost,
      totalCostPerUnit,
      targetMarginPercent,
      taxFeePercent,
      suggestedSalePrice,
      manualSalePrice,
      selectedSalePrice,
      grossProfitAtSelectedPrice,
      marginAtSelectedPrice,
    };
  }

  function saleMath({ quantity, unitPrice, discount, fixedFees, feePercent, unitCost }) {
    const qty = number(quantity);
    const price = number(unitPrice);
    const grossRevenue = qty * price;
    const percentFees = grossRevenue * (number(feePercent) / 100);
    const netRevenue = grossRevenue - number(discount) - number(fixedFees) - percentFees;
    const cogs = qty * number(unitCost);
    const grossProfit = netRevenue - cogs;
    const margin = netRevenue > 0 ? grossProfit / netRevenue : 0;
    return { grossRevenue, percentFees, netRevenue, cogs, grossProfit, margin };
  }

  function consignmentOpenAmount(consignment) {
    const soldValue = number(consignment.quantitySold) * number(consignment.unitPrice);
    return Math.max(soldValue - number(consignment.amountPaid), 0);
  }

  function consignmentAvailableWithClient(consignment) {
    return number(consignment.quantitySent) - number(consignment.quantitySold) - number(consignment.quantityReturned);
  }

  function businessMetrics(state) {
    const businessId = state.activeBusinessId;
    if (!businessId) {
      return {
        stockValue: 0,
        lowStockCount: 0,
        netRevenue: 0,
        grossProfit: 0,
        consignmentsOpen: 0,
        pendingOrders: 0,
      };
    }

    const products = state.products.filter((product) => product.businessId === businessId);
    const sales = state.sales.filter((sale) => sale.businessId === businessId);
    const consignments = state.consignments.filter((item) => item.businessId === businessId);
    const orders = state.orders.filter((order) => order.businessId === businessId);

    return {
      stockValue: products.reduce((sum, product) => sum + number(product.currentStock) * number(product.avgCost), 0),
      lowStockCount: products.filter((product) => number(product.minStock) > 0 && number(product.currentStock) <= number(product.minStock)).length,
      netRevenue: sales.reduce((sum, sale) => sum + number(sale.netRevenue), 0),
      grossProfit: sales.reduce((sum, sale) => sum + number(sale.grossProfit), 0),
      consignmentsOpen: consignments.reduce((sum, item) => sum + consignmentOpenAmount(item), 0),
      pendingOrders: orders.filter((order) => !['despachado', 'concluido'].includes(order.status)).length,
    };
  }

  window.C360.calc = {
    weightedAverageCost,
    calculateRecipeCost,
    saleMath,
    consignmentOpenAmount,
    consignmentAvailableWithClient,
    businessMetrics,
  };
})();
</script>

      return `<row r="${r}">${cellsXml}</row>`;

      let name = sanitizeSheetName(sheet.name, `Planilha${i + 1}`);

      let suffix = 2;
      while (usedNames.has(unique.toLowerCase())) {

    const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
      `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
      `<Default Extension="xml" ContentType="application/xml"/>` +
      `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      prepared.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') +
      `</Types>`;

    const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>` +
      `</Relationships>`;
    files.push({ path: '_rels/.rels', data: ENC.encode(rootRels) });

    const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">` +
      `<sheets>` +
      prepared.map((sheet, i) => `<sheet name="${xmlEscape(sheet.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') +
      `</sheets></workbook>`;
    files.push({ path: 'xl/workbook.xml', data: ENC.encode(workbook) });

    const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
      `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
      prepared.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') +

  function zipStored(files) {

    const central = [];
    let offset = 0;

    files.forEach((file) => {
      const nameBytes = ENC.encode(file.path);
      const crc = crc32(file.data);
      const size = file.data.length;

      // Cabeçalho local

      pushU16(out, 20); // versão necessária
      pushU16(out, 0); // flags
      pushU16(out, 0); // método: 0 = stored
      pushU16(out, 0); // hora
      pushU16(out, 0x21); // data (1980-01-01)
      pushU32(out, crc);
      pushU32(out, size);
      pushU32(out, size);
      pushU16(out, nameBytes.length);
      pushU16(out, 0); // extra
      pushBytes(out, nameBytes);
      pushBytes(out, file.data);

      // Entrada do diretório central
      pushU32(central, 0x02014b50);
      pushU16(central, 20); // versão criadora
      pushU16(central, 20); // versão necessária
      pushU16(central, 0);
      pushU16(central, 0);
      pushU16(central, 0);
      pushU16(central, 0x21);
      pushU32(central, crc);
      pushU32(central, size);
      pushU32(central, size);
      pushU16(central, nameBytes.length);
      pushU16(central, 0);
      pushU16(central, 0);
      pushU16(central, 0);
      pushU16(central, 0);
      pushU32(central, 0);
      pushU32(central, offset);
      pushBytes(central, nameBytes);

      offset += 30 + nameBytes.length + size;

    const centralOffset = offset;
    const centralSize = central.length;

    const eocd = [];
    pushU32(eocd, 0x06054b50);
    pushU16(eocd, 0);
    pushU16(eocd, 0);
    pushU16(eocd, files.length);
    pushU16(eocd, files.length);
    pushU32(eocd, centralSize);
    pushU32(eocd, centralOffset);
    pushU16(eocd, 0);

    const total = new Uint8Array(out.length + central.length + eocd.length);
    total.set(out, 0);
    total.set(central, out.length);
    total.set(eocd, out.length + central.length);

    return new Blob([total], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
  }

  // ----- Leitura -----
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('Este navegador não consegue ler planilhas compactadas. Atualize o navegador ou use o backup JSON.');
    }
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const buffer = await new Response(stream).arrayBuffer();
    return new Uint8Array(buffer);
  }

  function findEocd(view, length) {
    for (let i = length - 22; i >= 0; i -= 1) {
      if (view.getUint32(i, true) === 0x06054b50) return i;
    }
    return -1;
  }

  async function unzip(arrayBuffer) {
    const bytes = new Uint8Array(arrayBuffer);
    const view = new DataView(arrayBuffer);
    const eocd = findEocd(view, bytes.length);
    if (eocd === -1) throw new Error('Arquivo não é um .xlsx válido.');

    const count = view.getUint16(eocd + 10, true);
    let pointer = view.getUint32(eocd + 16, true);
    const entries = {};

    for (let n = 0; n < count; n += 1) {
      if (view.getUint32(pointer, true) !== 0x02014b50) break;
      const method = view.getUint16(pointer + 10, true);
      const compSize = view.getUint32(pointer + 20, true);
      const nameLen = view.getUint16(pointer + 28, true);
      const extraLen = view.getUint16(pointer + 30, true);
      const commentLen = view.getUint16(pointer + 32, true);
      const localOffset = view.getUint32(pointer + 42, true);
      const name = DEC.decode(bytes.subarray(pointer + 46, pointer + 46 + nameLen));

      const localNameLen = view.getUint16(localOffset + 26, true);
      const localExtraLen = view.getUint16(localOffset + 28, true);
      const dataStart = localOffset + 30 + localNameLen + localExtraLen;
      const raw = bytes.subarray(dataStart, dataStart + compSize);

      // eslint-disable-next-line no-await-in-loop
      entries[name] = method === 0 ? raw : await inflateRaw(raw);
      pointer += 46 + nameLen + extraLen + commentLen;
    }

    return entries;
  }

  function parseXml(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) {
      throw new Error('Não foi possível ler o conteúdo da planilha.');
    }

  }

  function readSharedStrings(entries) {
    const file = entries['xl/sharedStrings.xml'];
    if (!file) return [];
    const doc = parseXml(DEC.decode(file));

      index = index * 26 + (letters.charCodeAt(i) - 64);
    }

  }

  function readSheetRows(xml, shared) {
    const doc = parseXml(xml);
    const rows = [];
    [...doc.getElementsByTagName('row')].forEach((rowEl) => {
      const cells = [];
      [...rowEl.getElementsByTagName('c')].forEach((cellEl) => {
        const colIndex = colRefToIndex(cellEl.getAttribute('r'));
        const type = cellEl.getAttribute('t');
        let value = '';
        if (type === 'inlineStr') {
          value = [...cellEl.getElementsByTagName('t')].map((t) => t.textContent).join('');
        } else {
          const vEl = cellEl.getElementsByTagName('v')[0];
          const raw = vEl ? vEl.textContent : '';
          if (type === 's') {
            value = shared[Number(raw)] ?? '';
          } else if (type === 'str') {
            value = raw;
          } else if (type === 'b') {
            value = raw === '1';
          } else {
            value = raw === '' ? '' : Number(raw);
          }
        }
        cells[colIndex] = value;
      });
      for (let i = 0; i < cells.length; i += 1) if (cells[i] === undefined) cells[i] = '';
      rows.push(cells);
    });
    return rows;
  }

  async function parseXlsx(arrayBuffer) {
    const entries = await unzip(arrayBuffer);
    const shared = readSharedStrings(entries);

    const relsFile = entries['xl/_rels/workbook.xml.rels'];
    const rels = {};
    if (relsFile) {
      const relsDoc = parseXml(DEC.decode(relsFile));
      [...relsDoc.getElementsByTagName('Relationship')].forEach((rel) => {
        rels[rel.getAttribute('Id')] = rel.getAttribute('Target');
      });
    }

    const workbookFile = entries['xl/workbook.xml'];
    if (!workbookFile) throw new Error('Planilha sem workbook.xml.');
    const workbookDoc = parseXml(DEC.decode(workbookFile));

    const result = [];
    [...workbookDoc.getElementsByTagName('sheet')].forEach((sheetEl, i) => {
      const name = sheetEl.getAttribute('name') || `Planilha${i + 1}`;
      const rid = sheetEl.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') ||
        sheetEl.getAttribute('r:id');
      let target = rels[rid];
      if (!target) target = `worksheets/sheet${i + 1}.xml`;
      target = target.replace(/^\//, '').replace(/^xl\//, '');
      const path = `xl/${target}`;
      const file = entries[path];
      const rows = file ? readSheetRows(DEC.decode(file), shared) : [];
      result.push({ name, rows });
    });

    return result;
  }

  window.C360.xlsx = {
    buildXlsx,
    parseXlsx,
  };
})();

      }
    });
    return result;
  }

  async function importXlsx(file) {
    try {
      const buffer = await file.arrayBuffer();
      const sheets = await XLSX.parseXlsx(buffer);
      const sheetMap = {};
      sheets.forEach((sheet) => { sheetMap[deburr(sheet.name)] = sheet; });

      const collections = collectionsFromSheets(sheetMap);

      const current = S.getState();
      const next = {
        meta: current.meta,
        settings: current.settings,
        activeBusinessId: current.activeBusinessId,
        ...collections,
      };

      const backupSheet = sheetMap[deburr(BACKUP_SHEET)];
      if (backupSheet) {
        const configCell = backupSheet.rows.find((row) => row[0] === BACKUP_MARKER);
        if (configCell && configCell[1]) {
          try {
            const config = JSON.parse(configCell[1]);
            if (config.settings) next.settings = config.settings;
            if (config.meta) next.meta = config.meta;
            if (config.activeBusinessId) next.activeBusinessId = config.activeBusinessId;
          } catch (error) {
            /* configuração ilegível: mantém a atual */
          }
        }
      }

      const validBusiness = next.businesses.some((b) => b.id === next.activeBusinessId);
      if (!validBusiness) next.activeBusinessId = next.businesses[0]?.id || null;

      const total = COLLECTIONS.reduce((sum, c) => sum + (next[c.key] || []).length, 0);
      if (!window.confirm(`Importar esta planilha vai substituir os dados locais atuais por ${total} registro(s). Continuar?`)) {
        return;
      }

      S.replaceState(next);
      refresh();
      notify('Planilha importada com sucesso.', 'success');
    } catch (error) {
      notify('Não foi possível importar: ' + error.message, 'error');
      window.alert('Não foi possível importar: ' + error.message);
    }
  }

  // ---------- CSV por módulo ----------
  function csvField(value) {
    const text = String(value ?? '');
    if (/[;"\n\r]/.test(text)) return `"${text.replaceAll('"', '""')}"`;
    return text;
  }

  function exportCsv(collectionKey) {
    const collection = COLLECTIONS.find((item) => item.key === collectionKey);
    if (!collection) return;
    const state = S.getState();
    let records = state[collectionKey] || [];
    if (collectionKey !== 'businesses' && state.activeBusinessId) {
      records = records.filter((record) => record.businessId === state.activeBusinessId);
    }
    const fields = fieldsFor(collection, records);
    const lines = [fields.map((key) => csvField(label(key))).join(';')];
    records.forEach((record) => {
      lines.push(fields.map((key) => csvField(cellValue(key, record[key]))).join(';'));
    });
    const content = '\ufeff' + lines.join('\r\n');
    U.downloadText(`controle360-${deburr(collection.sheet).replaceAll(' ', '-')}-${U.today()}.csv`, content, 'text/csv;charset=utf-8');
    notify(`CSV de ${collection.sheet} exportado.`, 'success');
  }

  // ---------- JSON ----------
  function exportJson() {
    U.downloadText(`controle360-backup-${U.today()}.json`, JSON.stringify(S.getState(), null, 2));
    notify('Backup JSON exportado.', 'success');
  }

  function importJson(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!window.confirm('Importar este backup JSON vai substituir os dados locais atuais. Continuar?')) return;
        S.replaceState(parsed);
        refresh();
        notify('Backup JSON importado.', 'success');
      } catch (error) {
        notify('Backup inválido: ' + error.message, 'error');
        window.alert('Backup inválido: ' + error.message);
      }
    };
    reader.readAsText(file);
  }

  window.C360.io = {
    COLLECTIONS,
    exportXlsx,
    importXlsx,
    exportCsv,
    exportJson,
    importJson,
  };
})();
</script>

  function addBusiness(data) {
    const business = S.addGlobal('businesses', {
      name: data.name.trim(),
      segment: data.segment,
      defaultTargetMargin: U.number(data.defaultTargetMargin),
      defaultFeePercent: U.number(data.defaultFeePercent),
      notes: data.notes || '',
    });
    S.setActiveBusiness(business.id);
  }

  function addProduct(data) {
    const business = S.activeBusiness();
    S.add('products', {
      name: data.name.trim(),
      type: data.type,
      unit: data.unit,
      currentStock: U.number(data.currentStock),
      avgCost: U.number(data.avgCost),
      salePrice: U.number(data.salePrice),
      minStock: U.number(data.minStock),
      laborCostPerUnit: U.number(data.laborCostPerUnit),
      overheadCostPerUnit: U.number(data.overheadCostPerUnit),
      lossPercent: U.number(data.lossPercent),
      targetMarginPercent: data.targetMarginPercent === '' ? U.number(business?.defaultTargetMargin) : U.number(data.targetMarginPercent),
      taxFeePercent: data.taxFeePercent === '' ? U.number(business?.defaultFeePercent) : U.number(data.taxFeePercent),
      notes: data.notes || '',
    });
  }

  function addPurchase(data) {
    U.assertPositive(data.quantity, 'Quantidade');
    U.assertPositive(data.totalCost, 'Valor total');
    const product = productById(data.productId);
    if (!product) throw new Error('Produto não encontrado.');
    const quantity = U.number(data.quantity);
    const totalCost = U.number(data.totalCost);
    const unitCost = totalCost / quantity;
    const nextAvg = Calc.weightedAverageCost(product.currentStock, product.avgCost, quantity, totalCost);
    S.update('products', product.id, {
      currentStock: U.number(product.currentStock) + quantity,
      avgCost: nextAvg,
    });
    S.add('purchases', {
      date: data.date,
      supplierId: data.supplierId || '',
      productId: product.id,
      quantity,
      totalCost,
      unitCost,
      notes: data.notes || '',
    });
    S.recordMovement({
      date: data.date,
      type: 'entrada_compra',
      productId: product.id,
      quantity,
      unitCost,
      totalCost,
      notes: data.notes || '',
    });
  }

  function addRecipe(data) {
    U.assertPositive(data.quantityPerUnit, 'Quantidade por unidade');
    if (data.finalProductId === data.inputProductId) throw new Error('Produto final não pode consumir ele mesmo.');
    const duplicate = currentRecipes().find((row) => row.finalProductId === data.finalProductId && row.inputProductId === data.inputProductId);
    if (duplicate) throw new Error('Este item já existe na ficha técnica. Exclua o anterior antes de lançar novo valor.');
    S.add('recipes', {
      finalProductId: data.finalProductId,
      inputProductId: data.inputProductId,
      quantityPerUnit: U.number(data.quantityPerUnit),
    });
  }

  function addProduction(data) {
    U.assertPositive(data.quantity, 'Quantidade produzida');
    const finalProduct = productById(data.finalProductId);
    if (!finalProduct) throw new Error('Produto final não encontrado.');
    const recipe = Calc.calculateRecipeCost(finalProduct.id, state());
    if (!recipe.items.length) throw new Error('Produto final sem ficha técnica.');
    const quantity = U.number(data.quantity);

    const shortages = recipe.items.filter((item) => U.number(item.input?.currentStock) < item.quantityPerUnit * quantity);
    if (shortages.length) {
      const names = shortages.map((item) => item.input?.name || 'item removido').join(', ');
      throw new Error(`Estoque insuficiente para: ${names}.`);
    }

    let totalCost = 0;
    recipe.items.forEach((item) => {
      const consumedQty = item.quantityPerUnit * quantity;
      const cost = consumedQty * U.number(item.input.avgCost);
      totalCost += cost;
      S.update('products', item.input.id, { currentStock: U.number(item.input.currentStock) - consumedQty });
      S.recordMovement({
        date: data.date,
        type: 'saida_producao_insumo',
        productId: item.input.id,
        quantity: -consumedQty,
        unitCost: U.number(item.input.avgCost),
        totalCost: -cost,
        notes: `Produção de ${finalProduct.name}`,
      });
    });

    const extraCosts = (U.number(finalProduct.laborCostPerUnit) + U.number(finalProduct.overheadCostPerUnit)) * quantity;
    const lossCost = (totalCost + extraCosts) * (U.number(finalProduct.lossPercent) / 100);
    totalCost += extraCosts + lossCost;
    const unitCost = totalCost / quantity;
    const nextAvg = Calc.weightedAverageCost(finalProduct.currentStock, finalProduct.avgCost, quantity, totalCost);

    S.update('products', finalProduct.id, {
      currentStock: U.number(finalProduct.currentStock) + quantity,
      avgCost: nextAvg,
    });
    S.add('productions', {
      date: data.date,
      finalProductId: finalProduct.id,
      quantity,
      totalCost,
      unitCost,
      notes: data.notes || '',
    });
    S.recordMovement({
      date: data.date,
      type: 'entrada_producao_produto_final',
      productId: finalProduct.id,
      quantity,
      unitCost,
      totalCost,
      notes: data.notes || '',
    });
  }

  function addSale(data, options = {}) {
    U.assertPositive(data.quantity, 'Quantidade');
    U.assertPositive(data.unitPrice, 'Preço unitário');
    const product = productById(data.productId);
    if (!product) throw new Error('Produto não encontrado.');
    const quantity = U.number(data.quantity);
    if (product.type !== 'servico' && U.number(product.currentStock) < quantity && !options.skipStockCheck) {
      throw new Error(`Estoque insuficiente. Disponível: ${U.qty(product.currentStock, product.unit)}.`);
    }
    const unitCost = options.unitCostOverride ?? U.number(product.avgCost);
    const math = Calc.saleMath({
      quantity,
      unitPrice: data.unitPrice,
      discount: data.discount,
      fixedFees: data.fixedFees,
      feePercent: data.feePercent,
      unitCost,
    });
    const sale = S.add('sales', {
      date: data.date,
      channel: data.channel || 'Direto',
      clientId: data.clientId || '',
      productId: product.id,
      quantity,
      unitPrice: U.number(data.unitPrice),
      discount: U.number(data.discount),
      fixedFees: U.number(data.fixedFees),
      feePercent: U.number(data.feePercent),
      unitCost,
      ...math,
      notes: data.notes || '',
      origin: options.origin || 'manual',
      originId: options.originId || '',
    });

    if (product.type !== 'servico' && !options.skipStockMovement) {
      S.update('products', product.id, { currentStock: U.number(product.currentStock) - quantity });
      S.recordMovement({
        date: data.date,
        type: 'saida_venda',
        productId: product.id,
        quantity: -quantity,
        unitCost,
        totalCost: -(quantity * unitCost),
        notes: data.notes || '',
      });
    }
    return sale;
  }

  function addOrder(data) {
    U.assertPositive(data.quantity, 'Quantidade');
    U.assertPositive(data.unitPrice, 'Preço unitário');
    S.add('orders', {
      clientId: data.clientId || '',
      productId: data.productId,
      quantity: U.number(data.quantity),
      unitPrice: U.number(data.unitPrice),
      dueDate: data.dueDate || '',
      status: data.status || 'pendente',
      notes: data.notes || '',
      convertedSaleId: '',
    });
  }

  function addConsignment(data) {
    U.assertPositive(data.quantitySent, 'Quantidade enviada');
    U.assertPositive(data.unitPrice, 'Preço unitário');
    const product = productById(data.productId);
    if (!product) throw new Error('Produto não encontrado.');
    const quantitySent = U.number(data.quantitySent);
    if (U.number(product.currentStock) < quantitySent) throw new Error(`Estoque insuficiente. Disponível: ${U.qty(product.currentStock, product.unit)}.`);
    const costAtSend = U.number(product.avgCost);
    S.update('products', product.id, { currentStock: U.number(product.currentStock) - quantitySent });
    const record = S.add('consignments', {
      date: data.date,
      clientId: data.clientId,
      productId: product.id,
      quantitySent,
      quantitySold: 0,
      quantityReturned: 0,
      amountPaid: 0,
      unitPrice: U.number(data.unitPrice),
      costAtSend,
      notes: data.notes || '',
      status: 'com_cliente',
    });
    S.recordMovement({
      date: data.date,
      type: 'saida_envio_consignado',
      productId: product.id,
      quantity: -quantitySent,
      unitCost: costAtSend,
      totalCost: -(quantitySent * costAtSend),
      notes: `Envio consignado ${record.id}`,
    });
  }

  function deleteRecord(collection, id) {
    S.remove(collection, id);
  }

  function handleSubmit(event) {
    const form = event.target.closest('form');
    if (!form) return;
    event.preventDefault();
    try {
      const data = U.formData(form);
      const handlers = {
        businessForm: addBusiness,
        productForm: addProduct,
        clientForm: (d) => S.add('clients', { name: d.name.trim(), phone: d.phone || '', type: d.type || 'cliente', notes: d.notes || '' }),
        supplierForm: (d) => S.add('suppliers', { name: d.name.trim(), phone: d.phone || '', notes: d.notes || '' }),
        purchaseForm: addPurchase,
        recipeForm: addRecipe,
        productionForm: addProduction,
        saleForm: addSale,
        orderForm: addOrder,
        consignmentForm: addConsignment,
        taskForm: (d) => S.add('tasks', { title: d.title.trim(), dueDate: d.dueDate || '', status: d.status || 'a_fazer', notes: d.notes || '' }),
      };
      const handler = handlers[form.id];
      if (!handler) return;
      handler(data);
      form.reset();
      renderAll();
    } catch (error) {
      alert(error.message);
    }
  }

  function handleClick(event) {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const { action, id } = button.dataset;
    try {
      switch (action) {
        case 'select-business':
          S.setActiveBusiness(id);
          break;
        case 'delete-business':
          if (confirm('Excluir este negócio e todos os dados vinculados a ele?')) deleteBusinessCascade(id);
          break;
        case 'delete-product':
          if (confirm('Excluir produto? As movimentações antigas ficam no histórico com item removido.')) deleteRecord('products', id);
          break;
        case 'delete-client': deleteRecord('clients', id); break;
        case 'delete-supplier': deleteRecord('suppliers', id); break;
        case 'delete-recipe': deleteRecord('recipes', id); break;
        case 'delete-order': deleteRecord('orders', id); break;
        case 'delete-task': deleteRecord('tasks', id); break;
        case 'delete-consignment':
          if (confirm('Excluir consignação? Isso não desfaz estoque automaticamente. Use apenas para correção manual/revisão.')) deleteRecord('consignments', id);
          break;
        case 'convert-order-sale':
          convertOrderToSale(id);
          break;
        case 'consign-sell':
          consignmentSell(id);
          break;
        case 'consign-return':
          consignmentReturn(id);
          break;
        case 'consign-pay':
          consignmentPay(id);
          break;
        default:
          return;
      }
      renderAll();
    } catch (error) {
      alert(error.message);
    }
  }

  function deleteBusinessCascade(businessId) {
    const keys = ['products', 'clients', 'suppliers', 'purchases', 'stockMovements', 'recipes', 'productions', 'sales', 'orders', 'consignments', 'consignmentEvents', 'tasks'];
    const next = state();
    keys.forEach((key) => {
      next[key] = next[key].filter((item) => item.businessId !== businessId);
    });
    next.businesses = next.businesses.filter((business) => business.id !== businessId);
    if (next.activeBusinessId === businessId) next.activeBusinessId = next.businesses[0]?.id || null;
    S.replaceState(next);
  }

  function convertOrderToSale(orderId) {
    const order = state().orders.find((item) => item.id === orderId);
    if (!order) throw new Error('Pedido não encontrado.');
    if (order.convertedSaleId) throw new Error('Pedido já foi convertido em venda.');
    const sale = addSale({
      date: U.today(),
      channel: 'Pedido',
      clientId: order.clientId,
      productId: order.productId,
      quantity: order.quantity,
      unitPrice: order.unitPrice,
      discount: 0,
      fixedFees: 0,
      feePercent: 0,
      notes: `Baixa automática do pedido ${order.id}`,
    }, { origin: 'pedido', originId: order.id });
    S.update('orders', order.id, { convertedSaleId: sale.id, status: 'despachado' });
  }

  function consignmentSell(id) {
    const item = state().consignments.find((record) => record.id === id);
    if (!item) throw new Error('Consignação não encontrada.');
    const product = productById(item.productId);
    if (!product) throw new Error('Produto da consignação não encontrado.');
    const available = Calc.consignmentAvailableWithClient(item);
    const qtyText = prompt(`Quantidade vendida pelo cliente? Disponível com cliente: ${U.qty(available, product?.unit)}`);
    if (qtyText === null) return;
    const quantity = U.number(qtyText);
    U.assertPositive(quantity, 'Quantidade vendida');
    if (quantity > available) throw new Error('Quantidade maior que o disponível com o cliente.');
    addSale({
      date: U.today(),
      channel: 'Consignado',
      clientId: item.clientId,
      productId: item.productId,
      quantity,
      unitPrice: item.unitPrice,
      discount: 0,
      fixedFees: 0,
      feePercent: 0,
      notes: `Venda informada na consignação ${item.id}`,
    }, { skipStockMovement: true, skipStockCheck: true, unitCostOverride: item.costAtSend, origin: 'consignado', originId: item.id });
    S.update('consignments', item.id, { quantitySold: U.number(item.quantitySold) + quantity });
    S.add('consignmentEvents', { consignmentId: item.id, type: 'venda_cliente', date: U.today(), quantity, amount: quantity * U.number(item.unitPrice) });
  }

  function consignmentReturn(id) {
    const item = state().consignments.find((record) => record.id === id);
    if (!item) throw new Error('Consignação não encontrada.');
    const product = productById(item.productId);
    if (!product) throw new Error('Produto da consignação não encontrado.');
    const available = Calc.consignmentAvailableWithClient(item);
    const qtyText = prompt(`Quantidade devolvida? Disponível com cliente: ${U.qty(available, product?.unit)}`);
    if (qtyText === null) return;
    const quantity = U.number(qtyText);
    U.assertPositive(quantity, 'Quantidade devolvida');
    if (quantity > available) throw new Error('Quantidade maior que o disponível com o cliente.');
    S.update('products', product.id, { currentStock: U.number(product.currentStock) + quantity });
    S.update('consignments', item.id, { quantityReturned: U.number(item.quantityReturned) + quantity });
    S.recordMovement({
      date: U.today(),
      type: 'entrada_devolucao_consignado',
      productId: product.id,
      quantity,
      unitCost: U.number(item.costAtSend),
      totalCost: quantity * U.number(item.costAtSend),
      notes: `Devolução consignado ${item.id}`,
    });
    S.add('consignmentEvents', { consignmentId: item.id, type: 'devolucao', date: U.today(), quantity, amount: 0 });
  }

  function consignmentPay(id) {
    const item = state().consignments.find((record) => record.id === id);
    if (!item) throw new Error('Consignação não encontrada.');
    const open = Calc.consignmentOpenAmount(item);
    if (open <= 0) throw new Error('Não há valor em aberto nesta consignação.');
    const amountText = prompt(`Valor pago pelo cliente? Em aberto: ${U.money(open)}`);
    if (amountText === null) return;
    const amount = U.number(amountText);
    U.assertPositive(amount, 'Valor pago');
    if (amount > open) throw new Error('Valor pago maior que o valor em aberto.');
    S.update('consignments', item.id, { amountPaid: U.number(item.amountPaid) + amount });
    S.add('consignmentEvents', { consignmentId: item.id, type: 'pagamento', date: U.today(), quantity: 0, amount });
  }

  function handleCostPreview(event) {
    const form = event.target.closest('#costPreviewForm');
    if (!form) return;
    event.preventDefault();
    const data = U.formData(form);
    const el = document.getElementById('costPreview');
    if (!el || !data.finalProductId) return;
    el.innerHTML = renderCostPreview(Calc.calculateRecipeCost(data.finalProductId, state()));
  }

  function handleKanbanDragStart(event) {
    const card = event.target.closest('.kanban-card');
    if (!card) return;
    const board = event.target.closest('[data-kanban-type]');
    draggedCard = { id: card.dataset.cardId, type: board.dataset.kanbanType };
    event.dataTransfer.effectAllowed = 'move';
  }

  function handleKanbanDragOver(event) {
    const column = event.target.closest('.kanban-column');
    if (!column) return;
    event.preventDefault();
    column.classList.add('drag-over');
  }

  function handleKanbanDragLeave(event) {
    const column = event.target.closest('.kanban-column');
    if (column) column.classList.remove('drag-over');
  }

  function handleKanbanDrop(event) {
    const column = event.target.closest('.kanban-column');
    if (!column || !draggedCard) return;
    event.preventDefault();
    column.classList.remove('drag-over');
    const collection = draggedCard.type === 'orders' ? 'orders' : 'tasks';
    S.update(collection, draggedCard.id, { status: column.dataset.status });
    draggedCard = null;
    renderAll();
  }

  // ---------- Ajuda contextual (balão do ícone "ⓘ") ----------
  let tipEl = null;
  function ensureTip() {
    if (tipEl) return tipEl;
    tipEl = document.createElement('div');
    tipEl.className = 'help-tip';
    tipEl.setAttribute('role', 'tooltip');
    document.body.appendChild(tipEl);
    return tipEl;
  }
  function showTip(target) {
    const text = target.getAttribute('data-tip');
    if (!text) return;
    const tip = ensureTip();
    tip.textContent = text;
    tip.classList.add('show');
    const margin = 10;
    const r = target.getBoundingClientRect();
    const tr = tip.getBoundingClientRect();
    let left = r.left + r.width / 2 - tr.width / 2;
    left = Math.max(margin, Math.min(left, window.innerWidth - tr.width - margin));
    let top = r.top - tr.height - 8;
    if (top < margin) top = r.bottom + 8; // sem espaço acima: mostra abaixo
    tip.style.left = `${Math.round(left)}px`;
    tip.style.top = `${Math.round(top)}px`;
  }
  function hideTip() {
    if (tipEl) tipEl.classList.remove('show');
  }
  function bindHelpTips() {
    document.addEventListener('mouseover', (event) => {
      const target = event.target.closest('[data-tip]');
      if (target) showTip(target);
    });
    document.addEventListener('mouseout', (event) => {
      if (event.target.closest('[data-tip]')) hideTip();
    });
    document.addEventListener('focusin', (event) => {
      const target = event.target.closest('[data-tip]');
      if (target) showTip(target);
    });
    document.addEventListener('focusout', hideTip);
    // Toque fora do ícone fecha o balão no celular.
    document.addEventListener('click', (event) => {
      if (!event.target.closest('[data-tip]')) hideTip();
    });
    window.addEventListener('scroll', hideTip, true);
    window.addEventListener('resize', hideTip);
  }

  function bindEvents() {
    bindHelpTips();
    els.tabs.forEach((button) => button.addEventListener('click', () => setTab(button.dataset.tab)));
    els.activeBusiness.addEventListener('change', (event) => { S.setActiveBusiness(event.target.value); renderAll(); });
    els.btnNewBusiness.addEventListener('click', () => setTab('negocios'));
    els.btnExport.addEventListener('click', () => window.C360.io.exportXlsx());
    els.btnDataTab.addEventListener('click', () => setTab('dados'));
    els.btnReset.addEventListener('click', () => {
      if (confirm('Zerar todos os dados locais deste navegador? Faça um backup antes.')) {
        S.reset();
        renderAll();
        toast('Dados locais zerados.', 'success');
      }
    });
    document.addEventListener('submit', handleSubmit);
    document.addEventListener('click', handleClick);
    document.addEventListener('click', handleDataActions);
    document.addEventListener('change', handleFileInputs);
    document.addEventListener('submit', handleCostPreview, true);
    document.addEventListener('dragstart', handleKanbanDragStart);
    document.addEventListener('dragover', handleKanbanDragOver);
    document.addEventListener('dragleave', handleKanbanDragLeave);
    document.addEventListener('drop', handleKanbanDrop);
  }

  function handleDataActions(event) {
    const trigger = event.target.closest('[data-io]');
    if (!trigger) return;
    const action = trigger.dataset.io;
    const io = window.C360.io;
    if (action === 'export-xlsx') io.exportXlsx();
    else if (action === 'export-json') io.exportJson();
    else if (action === 'export-csv') io.exportCsv(trigger.dataset.collection);
  }

  function handleFileInputs(event) {
    const input = event.target.closest('[data-io-import]');
    if (!input || !input.files || !input.files[0]) return;
    const kind = input.dataset.ioImport;
    const file = input.files[0];
    if (kind === 'xlsx') window.C360.io.importXlsx(file);
    else if (kind === 'json') window.C360.io.importJson(file);
    input.value = '';
  }

  function toast(message, type = '') {
    if (!els.toastHost) return;
    const node = document.createElement('div');
    node.className = `toast ${type}`;
    node.textContent = message;
    els.toastHost.appendChild(node);
    requestAnimationFrame(() => node.classList.add('show'));
    setTimeout(() => {
      node.classList.remove('show');
      setTimeout(() => node.remove(), 250);
    }, 3200);
  }

  window.C360.app = { refresh: renderAll, toast };

  bindEvents();
  renderAll();
})();
</script>
</body>
</html>
