<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b6b55" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Finanças, despensa e compras da família, com privacidade e controle."
    />
    <title>Financeiro360 · Nossa casa</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/family/app.ts"></script>
    <script>
      // GitHub's branch-based Pages publisher may serve this source HTML before
      // the compiled deployment finishes. Load the last verified public build.
      if (
        !["localhost", "127.0.0.1"].includes(location.hostname) &&
        !document.querySelector('script[type="module"][src*="/assets/"]')
      ) {
        const style = document.createElement("link");
        style.rel = "stylesheet";
        style.href = "./fallback/app.css";
        document.head.append(style);
        const app = document.createElement("script");
        app.type = "module";
        app.src = "./fallback/app.js";
        document.body.append(app);
      }
    </script>
  </body>
</html>
