<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Xadrez 3D vs Máquina</title>
  <style>
    :root{--bg:#0b0f14;--panel:#111821;--panel2:#18212c;--text:#eef3f8;--muted:#9ba9b7;--accent:#d6b36a}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at top,#182433 0%,#0b0f14 55%,#070a0e 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);overflow:hidden}#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:rgba(8,12,17,.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.08);z-index:10}.title{font-weight:800;letter-spacing:.3px}.badge{font-size:12px;color:#161616;background:var(--accent);padding:5px 8px;border-radius:999px;font-weight:800}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,button{border:1px solid rgba(255,255,255,.12);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 11px;font-weight:700;cursor:pointer}main{position:relative;min-height:0}#scene{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;left:12px;bottom:12px;background:rgba(8,12,17,.78);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(10px);border-radius:14px;padding:10px 12px;max-width:min(370px,calc(100% - 24px));font-size:14px}#status{font-weight:800;margin-bottom:4px}#hint{color:var(--muted);font-size:12px;line-height:1.35}footer{display:flex;justify-content:center;gap:12px;align-items:center;padding:9px 12px;color:var(--muted);font-size:12px;background:rgba(8,12,17,.78);border-top:1px solid rgba(255,255,255,.07)}.dot{width:8px;height:8px;border-radius:50%;background:#58d68d;display:inline-block;margin-right:6px}@media(max-width:700px){header{align-items:flex-start}.titlewrap{min-width:120px}.controls{justify-content:flex-end}select,button{padding:8px 9px;font-size:12px}footer{font-size:11px}}
  </style>
</head>
<body>
<div id="app"><header><div class="titlewrap"><div class="title">♟ Xadrez 3D</div><div class="badge">VOCÊ vs MÁQUINA</div></div><div class="controls"><select id="difficulty"><option value="easy">Fácil</option><option value="medium" selected>Médio</option><option value="hard">Difícil</option></select><button id="flipBtn">Virar câmera</button><button id="newBtn">Novo jogo</button></div></header><main><canvas id="scene"></canvas><div id="hud"><div id="status">Sua vez — você joga de brancas.</div><div id="hint">Toque em uma peça e depois na casa de destino. Arraste para girar a câmera; use a pinça para zoom.</div></div></main><footer><span><span class="dot"></span>Pronto para jogar</span><span>IA local no navegador</span></footer></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { Chess } from 'https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm';
const canvas=document.getElementById('scene'),statusEl=document.getElementById('status'),difficultyEl=document.getElementById('difficulty');let chess=new Chess(),selectedSquare=null,legalSquares=[],machineThinking=false,cameraFlipped=false;const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0b0f14,15,34);const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;const camera=new THREE.PerspectiveCamera(43,1,.1,100);scene.add(new THREE.HemisphereLight(0xddeeff,0x1a2230,1.7));const key=new THREE.DirectionalLight(0xfff1d6,3);key.position.set(5,10,7);key.castShadow=true;scene.add(key);const boardGroup=new THREE.Group();scene.add(boardGroup);const lightMat=new THREE.MeshStandardMaterial({color:0xe5cf9a,roughness:.44}),darkMat=new THREE.MeshStandardMaterial({color:0x5c3923,roughness:.5}),frameMat=new THREE.MeshStandardMaterial({color:0x15100c,roughness:.28,metalness:.22}),markerMat=new THREE.MeshStandardMaterial({color:0x67e8a8,emissive:0x1a5f49,emissiveIntensity:1.6,transparent:true,opacity:.62}),selectMat=new THREE.MeshStandardMaterial({color:0xffd166,emissive:0x8d5f00,emissiveIntensity:1.2,transparent:true,opacity:.53});const squareMeshes=[],markers=[],pieceMeshes=[];const base=new THREE.Mesh(new THREE.BoxGeometry(9.2,.42,9.2),frameMat);base.position.y=-.26;boardGroup.add(base);for(let r=0;r<8;r++)for(let f=0;f<8;f++){const s=new THREE.Mesh(new THREE.BoxGeometry(1,.16,1),(r+f)%2===0?lightMat:darkMat);s.position.set(f-3.5,0,r-3.5);s.userData.square=String.fromCharCode(97+f)+(r+1);boardGroup.add(s);squareMeshes.push(s)}const ground=new THREE.Mesh(new THREE.CircleGeometry(18,64),new THREE.MeshStandardMaterial({color:0x090c10,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.position.y=-.49;scene.add(ground);function matFor(c){return new THREE.MeshPhysicalMaterial({color:c==='w'?0xf4ead7:0x20242b,roughness:c==='w'?.28:.22,metalness:.18,clearcoat:.55})}function part(g,geo,m,y,scale=[1,1,1],rot=[0,0,0],pos=[0,0,0]){const x=new THREE.Mesh(geo,m);x.position.set(pos[0],y+pos[1],pos[2]);x.scale.set(...scale);x.rotation.set(...rot);x.castShadow=true;g.add(x);return x}function makePiece(t,c){const g=new THREE.Group(),m=matFor(c);part(g,new THREE.CylinderGeometry(.34,.43,.16,28),m,.12);part(g,new THREE.CylinderGeometry(.27,.34,.16,28),m,.26);if(t==='p'){part(g,new THREE.CylinderGeometry(.17,.24,.46,24),m,.55);part(g,new THREE.SphereGeometry(.20,24,18),m,.86)}if(t==='r'){part(g,new THREE.CylinderGeometry(.25,.30,.54,8),m,.57);part(g,new THREE.CylinderGeometry(.35,.29,.22,8),m,.93)}if(t==='b'){part(g,new THREE.CylinderGeometry(.16,.27,.52,28),m,.58);part(g,new THREE.SphereGeometry(.25,26,20),m,.88,[.78,1.18,.78]);part(g,new THREE.ConeGeometry(.10,.26,22),m,1.16)}if(t==='n'){part(g,new THREE.CylinderGeometry(.19,.29,.38,24),m,.48);part(g,new THREE.CylinderGeometry(.16,.22,.48,18),m,.77,[1,1,1],[0,0,-.22],[.05,0,0]);part(g,new THREE.SphereGeometry(.27,24,18),m,1.02,[.9,1.08,.72],[0,0,-.18],[.10,0,0])}if(t==='q'){part(g,new THREE.CylinderGeometry(.17,.29,.66,28),m,.62);part(g,new THREE.SphereGeometry(.24,24,18),m,1.00,[1,.55,1]);part(g,new THREE.CylinderGeometry(.30,.22,.17,10),m,1.13)}if(t==='k'){part(g,new THREE.CylinderGeometry(.18,.30,.72,28),m,.64);part(g,new THREE.SphereGeometry(.22,24,18),m,1.02,[1,.6,1]);part(g,new THREE.BoxGeometry(.12,.38,.10),m,1.30);part(g,new THREE.BoxGeometry(.34,.10,.10),m,1.34)}g.scale.set(.86,.86,.86);return g}function pos(s){return new THREE.Vector3(s.charCodeAt(0)-97-3.5,.16,parseInt(s[1])-1-3.5)}function clearPieces(){for(const p of pieceMeshes)boardGroup.remove(p);pieceMeshes.length=0}function clearMarkers(){for(const m of markers)boardGroup.remove(m);markers.length=0}function refreshMarkers(){clearMarkers();if(selectedSquare){const p=pos(selectedSquare),h=new THREE.Mesh(new THREE.BoxGeometry(.92,.05,.92),selectMat);h.position.set(p.x,.13,p.z);h.userData.square=selectedSquare;boardGroup.add(h);markers.push(h)}for(const s of legalSquares){const p=pos(s),m=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.045,22),markerMat);m.position.set(p.x,.16,p.z);m.userData.square=s;boardGroup.add(m);markers.push(m)}}function updateStatus(){if(chess.isCheckmate()){statusEl.textContent=chess.turn()==='w'?'Xeque-mate — a máquina venceu.':'Xeque-mate — você venceu!';return}if(chess.isDraw()){statusEl.textContent='Empate.';return}if(machineThinking){statusEl.textContent='A máquina está pensando...';return}statusEl.textContent=chess.turn()==='w'?'Sua vez.':'Vez da máquina.'}function renderPieces(){clearPieces();for(let r=1;r<=8;r++)for(let f=0;f<8;f++){const s=String.fromCharCode(97+f)+r,p=chess.get(s);if(!p)continue;const o=makePiece(p.type,p.color);o.position.copy(pos(s));o.userData.square=s;o.userData.color=p.color;o.traverse(c=>c.userData.rootPiece=o);boardGroup.add(o);pieceMeshes.push(o)}refreshMarkers();updateStatus()}function selectSquare(s){if(machineThinking||chess.isGameOver()||chess.turn()!=='w')return;const p=chess.get(s);if(selectedSquare&&legalSquares.includes(s)){chess.move({from:selectedSquare,to:s,promotion:'q'});selectedSquare=null;legalSquares=[];renderPieces();if(!chess.isGameOver())setTimeout(machineMove,300);return}if(p&&p.color==='w'){selectedSquare=s;legalSquares=chess.moves({square:s,verbose:true}).map(m=>m.to);refreshMarkers()}else{selectedSquare=null;legalSquares=[];refreshMarkers()}}const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();let dragging=false,lastMove=null,yaw=Math.PI,pitch=.72,distance=13.25,down={x:0,y:0};function applyCamera(){const flip=cameraFlipped?Math.PI:0;camera.position.set(Math.sin(yaw+flip)*Math.cos(pitch)*distance,Math.sin(pitch)*distance,Math.cos(yaw+flip)*Math.cos(pitch)*distance);camera.lookAt(0,.2,0)}applyCamera();canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};lastMove={x:e.clientX,y:e.clientY};dragging=false});canvas.addEventListener('pointermove',e=>{if(!lastMove)return;const dx=e.clientX-lastMove.x,dy=e.clientY-lastMove.y;if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)dragging=true;if(dragging){yaw-=dx*.008;pitch=Math.max(.32,Math.min(1.18,pitch-dy*.006));applyCamera()}lastMove={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',e=>{lastMove=null;if(dragging)return;const rect=canvas.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects([...pieceMeshes,...markers,...squareMeshes],true);if(!hits.length)return;let o=hits[0].object;if(o.userData.rootPiece)o=o.userData.rootPiece;if(o.userData.square)selectSquare(o.userData.square)});canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(8.6,Math.min(18,distance+e.deltaY*.008));applyCamera()},{passive:false});const val={p:100,n:320,b:330,r:500,q:900,k:20000};function evalGame(g){let s=0;for(let r=1;r<=8;r++)for(let f=0;f<8;f++){const p=g.get(String.fromCharCode(97+f)+r);if(p)s+=(p.color==='b'?1:-1)*val[p.type]}return s}function minimax(g,d,a,b,maxB){if(d===0||g.isGameOver())return evalGame(g);const ms=g.moves({verbose:true});if(maxB){let best=-Infinity;for(const m of ms){g.move(m);best=Math.max(best,minimax(g,d-1,a,b,false));g.undo();a=Math.max(a,best);if(b<=a)break}return best}else{let best=Infinity;for(const m of ms){g.move(m);best=Math.min(best,minimax(g,d-1,a,b,true));g.undo();b=Math.min(b,best);if(b<=a)break}return best}}function chooseMachineMove(){const ms=chess.moves({verbose:true});if(difficultyEl.value==='easy')return ms[Math.floor(Math.random()*ms.length)];const d=difficultyEl.value==='hard'?3:2;let score=-Infinity,best=[];for(const m of ms){chess.move(m);const s=minimax(chess,d-1,-Infinity,Infinity,false);chess.undo();if(s>score){score=s;best=[m]}else if(s===score)best.push(m)}return best[Math.floor(Math.random()*best.length)]}function machineMove(){if(chess.isGameOver())return;machineThinking=true;updateStatus();setTimeout(()=>{const m=chooseMachineMove();if(m)chess.move(m);machineThinking=false;renderPieces()},100)}document.getElementById('newBtn').onclick=()=>{chess=new Chess();selectedSquare=null;legalSquares=[];machineThinking=false;renderPieces()};document.getElementById('flipBtn').onclick=()=>{cameraFlipped=!cameraFlipped;applyCamera()};function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();renderPieces();(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)})();
</script></body></html>
